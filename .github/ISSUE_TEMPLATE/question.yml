name: Home Lab 使用问题
description: Cloudflare 部署、配置和使用咨询
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: "请先阅读项目 README 与 docs/home-lab/。此处讨论本 fork，不是 Dashy 官方支持渠道。"
  - type: textarea
    id: question
    attributes:
      label: 问题与已经尝试的步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 部署方式与浏览器
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或错误信息
      description: 不要粘贴真实密码、Cookie、订阅 Token 或 API Key
