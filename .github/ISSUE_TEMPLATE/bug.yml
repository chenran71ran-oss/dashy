name: Home Lab 问题报告
description: 报告此 fork 的界面、Cloudflare 适配或功能问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请先阅读 docs/home-lab/faq.md。配置、截图与日志需要脱敏，勿提交 Cookie、Token 或 API Key。"
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      description: 例如 Windows / Chrome，iOS / Safari
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 视图与显示设置
      description: 总站/专注/工作台，主题、布局、尺寸；部署方式与相关组件类型
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际表现与期望结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
