name: Home Lab 功能建议
description: 提出有明确使用场景的改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述具体使用场景与现有困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明期望交互、相关视图与是否需要外部服务
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考与替代方案
      description: 可提供公开链接，请勿提交私人配置或密钥
