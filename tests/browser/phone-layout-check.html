<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Home Lab 响应式样式核对</title>
<style>body{font:14px system-ui;margin:16px;background:#e2e8f0;color:#172033}nav{display:flex;gap:12px;align-items:center;margin-bottom:12px}select{padding:8px}iframe{display:block;width:390px;height:790px;border:1px solid #64748b;background:white}pre{white-space:pre-wrap}main{display:flex;gap:20px;align-items:flex-start}</style>
<nav><label>宽度 <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1366</option></select></label><label>视图 <select id="view"><option value="home">总站</option><option value="minimal">专注</option><option value="workspace">工作台</option></select></label><label>主题 <select id="theme"><option value="material-original">原版质感浅色</option><option value="dashy-docs">文档蓝</option><option value="matrix-red">矩阵红</option></select></label><label><input type="checkbox" id="expanded">展开配置</label></nav>
<main><iframe id="sample" title="窄屏样式样本"></iframe><pre id="result">加载中</pre></main>
<script>
let fixtures={};const frame=document.querySelector('#sample'),result=document.querySelector('#result');
function render(){
 const width=document.querySelector('#width').value,view=document.querySelector('#view').value,theme=document.querySelector('#theme').value,expanded=document.querySelector('#expanded').checked;
 const fixture=fixtures[`${theme}:${view}:${expanded?'open':'closed'}`];
 result.removeAttribute('data-key');result.textContent='加载中';
 frame.style.width=`${width}px`;if(!fixture){result.textContent='样本尚未生成';return;}
 frame.srcdoc=`<!doctype html><html lang="zh-CN" data-theme="${theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${fixture.styles}</head><body>${fixture.markup}</body></html>`;
}
frame.onload=()=>{
 const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;
 const rect=s=>d.querySelector(s)?.getBoundingClientRect();
 const input=rect('#filter-tiles'),button=rect('.options-trigger'),title=rect('.page-titles'),panel=rect('.options-panel');
 const color=s=>{const e=d.querySelector(s);if(!e)return null;const c=w.getComputedStyle(e);return{foreground:c.color,background:c.backgroundColor,font:c.fontSize};};
 const n=x=>x==null?null:Math.round(x*100)/100;
 const key=`${document.querySelector('#theme').value}:${document.querySelector('#view').value}:${document.querySelector('#expanded').checked?'open':'closed'}`;
 result.textContent=JSON.stringify({key,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,inputHeight:n(input?.height),buttonHeight:n(button?.height),topDifference:input&&button?n(Math.abs(input.top-button.top)):null,titleHeight:n(title?.height),logoHeight:n(rect('.mech-logo')?.height),panelTop:n(panel?.top),buttonColor:color('.options-trigger'),titleColor:color('.page-titles h1')},null,2);
 result.dataset.key=`${key}@${w.innerWidth}`;
};
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('change',render));
fetch('/_phone-layout-fixtures.json').then(r=>r.json()).then(async data=>{
 if(data.gzip){const bytes=Uint8Array.from(atob(data.gzip),c=>c.charCodeAt(0));data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());}
 fixtures=data;render();
}).catch(e=>result.textContent=e.message);
</script></html>
